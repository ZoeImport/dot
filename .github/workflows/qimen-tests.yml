name: Qimen regression tests
on:
  pull_request:
    paths:
      - '_archived-skills/qimen-skill/**'
      - '.github/workflows/qimen-tests.yml'
  push:
    branches: [main]
    paths:
      - '_archived-skills/qimen-skill/**'
      - '.github/workflows/qimen-tests.yml'
jobs:
  qimen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
        working-directory: _archived-skills/qimen-skill
      - run: python -m pytest -q
        working-directory: _archived-skills/qimen-skill
