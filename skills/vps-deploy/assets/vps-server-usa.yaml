    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    geosite:cn:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    "+.anthropic.com":
    - https://cloudflare-dns.com/dns-query#vps-server-usa
    - https://dns.google/dns-query#vps-server-usa
    "+.claude.ai":
