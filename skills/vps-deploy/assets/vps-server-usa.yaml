  respect-rules: false
  proxy-server-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://cloudflare-dns.com/dns-query#vps-server-usa
  - https://dns.google/dns-query#vps-server-usa
  fallback: []
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
